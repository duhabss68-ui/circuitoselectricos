<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuitos eléctricos · 3.er grado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* VOICE: alegre y moderna, como una app de juegos para chicos de 14-15 años; stickers, contornos gruesos, colores vivos
   IDEA: la misión de encender la casa de la familia Ramírez; Chispa, un electrón, acompaña cada paso
   PICTURE: dibujos de objetos reales (focos con rosca, pilas, cables rojos, caimanes, interruptores) sobre una mesa de cuaderno cuadriculado
   COLOUR and TYPE: amarillo eléctrico, cian, rosa y menta con tinta azul marino; Fredoka para títulos, Nunito para texto
   LAYOUT: portada con la casa al atardecer y mapa de misión; lecciones con banda de color, pasos y simulador grande */
:root{--navy:#1B2A4A;--amarillo:#FFD23F;--rosa:#F04E7E;--cian:#1FB2EE;--menta:#22C29A;
--bg:#F3F9FF;--dot:#D9E8F6;--card:#fff;--panel:#EEF6FD;--ink:#1B2A4A;--muted:#55657F;--line:#D9E6F2;--head:#1B2A4A;--wire:#1B2A4A;--off:#E3ECF5;--stroke:#1B2A4A;
--d:"Fredoka","Trebuchet MS","Segoe UI",Arial,sans-serif;--x:"Nunito","Segoe UI",Arial,sans-serif;--r:22px;color-scheme:light}
:root[data-theme=dark]{--bg:#101a33;--dot:#1c2a4d;--card:#1a2647;--panel:#21305a;--ink:#EEF3FF;--muted:#AEBBD8;--line:#2C3B66;--head:#fff;--wire:#DDE7F5;--off:#2b3a63;--stroke:#050a1a;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a33;--dot:#1c2a4d;--card:#1a2647;--panel:#21305a;--ink:#EEF3FF;--muted:#AEBBD8;--line:#2C3B66;--head:#fff;--wire:#DDE7F5;--off:#2b3a63;--stroke:#050a1a;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1.3px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:17px/1.6 var(--x);overflow-x:clip}
h1,h2,h3,button,.boton,.chip,.d{font-family:var(--d)}
h1{font-size:clamp(34px,5vw,56px);line-height:1;margin:0 0 12px;font-weight:700;text-wrap:balance}
h2{font-size:28px;margin:36px 0 14px;color:var(--head);font-weight:700}
h3{font-size:20px;margin:0 0 8px;color:var(--head);font-weight:600;display:flex;align-items:center;gap:10px;line-height:1.2}
p{margin:0 0 12px}a{color:inherit}
.encabezado{background:var(--navy);color:#c9d6ee;padding:6px max(3vw,16px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.encabezado b{color:#fff;font-family:var(--d);font-weight:600}
.barra{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px max(3vw,16px);background:var(--card);border-bottom:3px solid var(--stroke);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font:700 24px var(--d);color:var(--head);text-decoration:none}
.logo svg{width:42px;height:42px}
.prog{flex:1 1 260px;display:flex;align-items:center;gap:10px;font:600 15px var(--d);color:var(--muted)}
.bulbs{display:flex;gap:2px}
.mb{width:24px;height:36px;display:block;transition:filter .3s}
.mb.on{filter:drop-shadow(0 0 6px #FFD23F) drop-shadow(0 0 2px #FFC21A)}
.pts{display:flex;align-items:center;gap:6px;font:700 18px var(--d);background:var(--amarillo);color:var(--navy);padding:5px 16px;border-radius:99px;border:2.5px solid var(--stroke);box-shadow:0 3px 0 var(--stroke);white-space:nowrap}
.pts svg{width:20px;height:20px}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1340px;margin:0 auto}
body.home .wrap{grid-template-columns:1fr}body.home #ruta{display:none}
#ruta{padding:22px 14px;position:sticky;top:66px;align-self:start;max-height:calc(100vh - 66px);overflow:auto}
.ruta-t{font:700 18px var(--d);color:var(--head);margin:0 10px 10px}
.item{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:16px;text-decoration:none;color:var(--ink);min-height:58px;border:2.5px solid transparent;margin-bottom:4px}
.item:hover{background:var(--card);border-color:var(--line)}
.item.activo{background:var(--amarillo);border-color:var(--stroke);box-shadow:0 4px 0 var(--stroke);color:var(--navy)}
.num{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:700 18px var(--d);border:2.5px solid var(--stroke);background:var(--tc);color:var(--navy)}
.teo{--tc:#8FDCFB;--tb:#1FB2EE}.prac{--tc:#FFB3C8;--tb:#FF7FA3}.proy{--tc:#FFE68A;--tb:#FFD23F}
.item.hecho .num{background:var(--menta);color:#fff}
.item b{font:600 16px/1.2 var(--d);display:block}.item small{color:inherit;opacity:.75;font-size:13px}
#ruta .nota{margin:14px 10px 0}
main{padding:24px clamp(16px,3.5vw,44px) 80px}
.nota{font-size:14px;color:var(--muted)}
/* botones */
button,.boton{min-height:48px;padding:10px 22px;font-size:18px;font-weight:600;border-radius:99px;border:2.5px solid var(--stroke);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 0 var(--stroke);transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled),.boton:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--stroke)}
button:active:not(:disabled),.boton:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.prim{background:var(--amarillo)!important;color:var(--navy)!important}
.dark{background:var(--navy)!important;color:#fff!important}
.cta{font-size:22px;min-height:60px;padding:12px 30px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--rosa);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.chip{display:inline-block;font-size:14px;font-weight:600;padding:3px 12px;border-radius:99px;border:2px solid var(--stroke);background:#fff;color:var(--navy)}
/* portada */
.hero{position:relative;background:var(--amarillo);color:var(--navy);border:3px solid var(--stroke);box-shadow:0 8px 0 var(--stroke);border-radius:34px;padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,3vw,44px);align-items:center;overflow:hidden}
.hero h1{font-size:clamp(46px,7.5vw,92px);line-height:.92;margin:14px 0 14px;color:var(--navy)}
.hero h1 span{display:inline-block;background:#fff;border:3px solid var(--stroke);border-radius:18px;padding:0 14px;transform:rotate(-2deg);box-shadow:0 5px 0 var(--stroke);margin-top:6px}
.hlead{font-size:20px;max-width:30ch;font-weight:600}
.hbtns{display:flex;flex-wrap:wrap;gap:14px;margin:22px 0 22px}
.hpic{position:relative}
.hpic svg{width:100%;height:auto;display:block;border-radius:26px;border:3px solid var(--stroke);box-shadow:0 8px 0 var(--stroke);background:#2a3a86}
.globo{display:flex;align-items:center;gap:12px}
.globo>.flota{flex:none;display:block;width:76px}.globo .chispa{width:76px;height:80px;display:block}
.burbuja{background:#fff;border:2.5px solid var(--stroke);border-radius:20px;padding:10px 16px;font-weight:700;font-size:16px;position:relative;box-shadow:0 4px 0 var(--stroke)}
.burbuja::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:#fff;border-left:2.5px solid var(--stroke);border-bottom:2.5px solid var(--stroke);transform:translateY(-50%) rotate(45deg)}
.burbuja b{color:var(--rosa)}
.sticker{position:absolute;pointer-events:none}
.star{animation:tw 2.6s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.flota{animation:flota 3.2s ease-in-out infinite}@keyframes flota{50%{transform:translateY(-8px)}}
.como{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin:30px 0 0}
.paso{display:flex;gap:14px;align-items:center;border:2.5px solid var(--stroke);border-radius:var(--r);padding:14px 18px;box-shadow:0 5px 0 var(--stroke);color:var(--navy)}
.paso svg{width:58px;height:58px;flex:none}
.paso b{font:700 21px var(--d);display:block}.paso span{font-size:15px;font-weight:600}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:22px}
.mi{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--card);border:2.5px solid var(--stroke);border-radius:26px;box-shadow:0 6px 0 var(--stroke);overflow:hidden;transition:transform .15s,box-shadow .15s}
.mi:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 10px 0 var(--stroke)}
.mi .arte{background:var(--tc);border-bottom:2.5px solid var(--stroke);height:130px;display:grid;place-items:center;position:relative}
.mi .arte svg{width:96px;height:96px}
.mi .badge{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2.5px solid var(--stroke);font:700 19px var(--d);color:var(--navy)}
.mi.hecho .badge{background:var(--menta);color:#fff}
.mi .cuerpo{padding:14px 18px 18px}
.mi .tipo{font:600 14px var(--d);color:var(--muted)}
.mi h3{font-size:21px;margin:4px 0 6px}
.mi p{font-size:15px;color:var(--muted);margin:0}
.mi .gan{display:inline-block;margin-top:8px;font:600 14px var(--d);background:var(--menta);color:#fff;padding:2px 12px;border-radius:99px}
.mi.next{outline:4px solid var(--rosa);outline-offset:4px}
.tag{position:absolute;top:12px;right:12px;z-index:2;background:var(--rosa);color:#fff;font:700 15px var(--d);padding:4px 14px;border-radius:99px;border:2.5px solid var(--stroke);transform:rotate(4deg)}
/* lección */
.lband{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;border-radius:30px;padding:clamp(22px,3.5vw,40px);color:var(--navy);background:var(--tb) radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.2px) 0 0/20px 20px;border:3px solid var(--stroke);box-shadow:0 7px 0 var(--stroke);margin-bottom:10px}
.lband h1{color:var(--navy)}.lband p{font-size:19px;font-weight:600;margin:0;max-width:56ch}
.lart{width:clamp(130px,16vw,190px);aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--stroke);display:grid;place-items:center;box-shadow:0 6px 0 var(--stroke);transform:rotate(-6deg)}
.lart svg{width:72%;height:72%}
.ganada{display:inline-block;margin-top:14px;background:var(--menta);color:#fff;font:600 16px var(--d);padding:5px 16px;border-radius:99px;border:2.5px solid var(--stroke)}
.steps{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 26px}
.steps button{padding:7px 22px 7px 7px}
.steps .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--stroke);font-weight:700;color:var(--navy)}
.steps button.on{background:var(--navy);color:#fff}.steps button.on .n{background:var(--amarillo)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}
.tarjeta{background:var(--card);border:2.5px solid var(--stroke);border-radius:var(--r);padding:20px 22px;box-shadow:0 6px 0 var(--stroke)}
.tarjeta svg.ico{width:100%;height:120px;display:block;margin-bottom:14px;background:var(--panel);border-radius:16px;padding:8px;border:2px solid var(--line)}
.ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--navy);font:700 19px var(--d);border:2.5px solid var(--stroke)}
.ic svg{width:22px;height:22px}
.aviso{display:flex;gap:14px;align-items:center;border:2.5px solid var(--stroke);background:#FFF3C4;color:var(--navy);padding:14px 18px;border-radius:var(--r);margin:22px 0;box-shadow:0 5px 0 var(--stroke);font-weight:600}
.aviso .chispa{width:58px;height:62px;flex:none}
.pasonav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
/* simuladores */
.lab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}
.sim{width:100%;height:auto;display:block;border-radius:24px;border:3px solid var(--stroke);box-shadow:0 7px 0 var(--stroke);background:#F4FBFF}
.cable-o{fill:none;stroke:#1B2A4A;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.cable{fill:none;stroke:#FF5E6C;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.e circle{fill:#1FB2EE;stroke:#fff;stroke-width:1.6}
.svgt{fill:#1B2A4A;font:600 16px var(--d)}
.svgs{fill:#55657F;font:700 14px var(--x)}
.bt{font:700 19px var(--d);fill:#1B2A4A}
.foco[role=button],.clic{cursor:pointer}
.panel{display:grid;gap:14px}
.ptitle{font:600 20px var(--d);margin:0;color:var(--head)}
.mats{display:flex;flex-wrap:wrap;gap:10px}
.mats button{font-size:16px;padding:6px 16px 6px 8px;min-height:48px}
.mico{width:42px;height:26px;flex:none}
.mats button.on{background:var(--cian);color:var(--navy)}
.estado{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r);background:var(--card);border:2.5px solid var(--stroke);box-shadow:0 4px 0 var(--stroke);font-weight:600}
.estado .chispa{width:54px;height:58px;flex:none}
.estado b{font-family:var(--d)}
.estado.si{background:#D9F7EE;color:var(--navy)}.estado.no{background:#FFE0EA;color:var(--navy)}
.big{font:700 clamp(30px,3.4vw,42px)/1.1 var(--d);color:var(--head);white-space:nowrap}
label.sl{display:grid;gap:0;font:600 19px var(--d);color:var(--head)}
label.sl span{color:var(--rosa)}
input[type=range]{width:100%;height:44px;accent-color:var(--rosa)}
input[type=number],select{font:17px var(--x);padding:10px 12px;border:2.5px solid var(--stroke);border-radius:14px;background:var(--card);color:var(--ink);min-height:48px;width:100%}
.tri{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.tri svg{width:160px;flex:none}
.simbolos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.simbolos .tarjeta{padding:12px;text-align:center}.simbolos svg{width:100%;height:60px}
.simbolos .tarjeta.ok{background:#D9F7EE}.simbolos .tarjeta.mal{background:#FFE0EA}
/* cuestionario */
.marcador{display:flex;gap:4px;align-items:center;margin:0 0 18px;font:600 18px var(--d);color:var(--head)}
.marcador .mb{width:30px;height:44px}
.q{background:var(--card);border:2.5px solid var(--stroke);border-radius:26px;padding:20px 22px;margin-bottom:18px;box-shadow:0 6px 0 var(--stroke)}
.qt{font:600 21px/1.3 var(--d);color:var(--head)}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.op{justify-content:flex-start;text-align:left;font:700 17px var(--x);width:100%;border-radius:18px;padding:8px 14px 8px 8px;min-height:60px;box-shadow:0 4px 0 var(--stroke)}
.let{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 19px var(--d);border:2px solid var(--stroke);color:var(--navy)}
.op:nth-child(1) .let{background:#8FDCFB}.op:nth-child(2) .let{background:#FFB3C8}.op:nth-child(3) .let{background:#FFE68A}.op:nth-child(4) .let{background:#9DEBD3}
.op.bien{background:#D9F7EE;color:var(--navy);opacity:1}.op.bien .let{background:var(--menta);color:#fff}
.op.mal{background:#FFE0EA;color:var(--navy);opacity:1}.op.mal .let{background:var(--rosa);color:#fff}
.op:disabled{opacity:.55}.op.bien:disabled,.op.mal:disabled{opacity:1}
.fb{display:flex;gap:12px;align-items:center;margin:14px 0 0;font-size:16px;font-weight:600}
.fb .chispa{width:50px;height:54px;flex:none}
.fb div{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.logro{position:relative;display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px 26px;border-radius:28px;background:var(--amarillo);color:var(--navy);border:3px solid var(--stroke);box-shadow:0 8px 0 var(--stroke)}
.logro h3{color:var(--navy);font-size:30px;margin:0}
.medal{width:90px;height:110px;flex:none}
.logro .chispa{width:70px;height:74px}
/* prácticas */
ol.pasos,ul.lista{padding-left:0;list-style:none;margin:0}
ol.pasos{display:grid;gap:12px}
ol.pasos li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;background:var(--card);border:2.5px solid var(--stroke);border-radius:18px;box-shadow:0 4px 0 var(--stroke);transition:background .2s}
ol.pasos li:has(input:checked){background:#D9F7EE;color:var(--navy)}
ol.pasos input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--menta)}
ol.pasos label{cursor:pointer;font-weight:600}
ol.pasos b{font-family:var(--d);font-weight:600}
ul.lista li{padding:6px 0 6px 28px;position:relative;font-weight:600}
ul.lista li::before{content:"";position:absolute;left:2px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--cian);border:2px solid var(--stroke)}
.tarjeta.seg{background:#FFE0EA;color:var(--navy)}.tarjeta.seg h3{color:var(--navy)}.tarjeta.seg ul.lista li::before{background:var(--rosa)}
.tarjeta.bit{background:#FFF3C4;color:var(--navy)}.tarjeta.bit h3{color:var(--navy)}.tarjeta.bit ul.lista li::before{background:var(--amarillo)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;background:var(--card);border:2.5px solid var(--stroke);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--stroke)}
th{background:var(--navy);color:#fff;font:600 17px var(--d);text-align:left;padding:12px}
td{padding:11px 12px;border-top:2px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--panel)}
.fecha{display:inline-block;background:var(--rosa);color:#fff;font:700 19px var(--d);padding:8px 20px;border-radius:99px;margin-top:16px;border:2.5px solid var(--stroke);box-shadow:0 4px 0 var(--stroke);transform:rotate(-2deg)}
.scroll{overflow-x:auto}
.confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confeti i{position:absolute;top:-16px;width:11px;height:17px;border-radius:3px;border:1.5px solid #1B2A4A;animation:cae 1.9s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes cae{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.yo{display:flex;align-items:center;gap:8px;min-width:0}
.yo-n{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-b{min-height:38px;padding:4px 14px;font-size:15px;box-shadow:0 3px 0 var(--stroke)}
body.login .prog,body.login .pts,body.maestro .prog,body.maestro .pts{visibility:hidden}
.loginbox{display:grid;grid-template-columns:auto minmax(0,460px);gap:34px;align-items:center;justify-content:center;background:var(--amarillo);color:var(--navy);border:3px solid var(--stroke);box-shadow:0 8px 0 var(--stroke);border-radius:34px;padding:clamp(24px,5vw,56px);max-width:900px;margin:30px auto}
.loginbox h1{color:var(--navy)}
.lg-art .chispa{width:clamp(120px,18vw,200px);height:auto}
#lf{display:grid;gap:14px;margin-top:10px}
#lf input{font:600 20px var(--x);padding:12px 14px;border:2.5px solid var(--stroke);border-radius:14px;width:100%;min-height:52px;background:#fff;color:var(--navy)}
.pw{display:flex;gap:8px;align-items:center}
.err{font-weight:800;color:#B3134A;min-height:1.4em;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;padding:12px 20px;border-radius:16px;z-index:80;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:90vw}
.reto{margin-bottom:22px}
.bandeja{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border:2.5px dashed var(--line);border-radius:18px;min-height:64px;margin-bottom:14px}
.ficha{min-height:44px;padding:6px 14px;font:700 16px var(--x);border-radius:12px;background:#fff;color:var(--navy);border:2.5px solid var(--stroke);box-shadow:0 3px 0 var(--stroke);cursor:grab;display:inline-flex;align-items:center}
.ficha.sel{background:var(--cian)}
.ficha.ok{background:#D9F7EE}.ficha.no{background:#FFE0EA}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:12px}

function electrons(svg,n){const[x0,y0,x1,y1]=BOX,w=x1-x0,h=y1-y0,P=2*(w+h),g=svg.querySelector('.e');
  g.innerHTML=Array.from({length:n},()=>'<circle r="5"/>').join('');const cs=[...g.children];
  const a={speed:0,off:0,step(dt){if(!reduce)this.off=(this.off+this.speed*dt*.06)%P;cs.forEach((c,i)=>{const t=(this.off+i*P/n)%P;let x,y;
    if(t<w){x=x0+t;y=y1}else if(t<w+h){x=x1;y=y1-(t-w)}else if(t<2*w+h){x=x1-(t-w-h);y=y0}else{x=x0;y=y0+(t-2*w-h)}
    c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1))})}};a.step(0);anims.push(a);return a}

const CL=L.map(l=>l.id),PRAC=L.filter(l=>l.tipo==='prac').map(l=>l.id);
const cN=id=>id==='investigacion'?'Guía de investigación':id==='inicio'?'Portada':id==='proyecto'?'Proyecto':id&&id.startsWith('clase-')?'Clase '+id.slice(6):'—';
const NIV={esperado:['Nivel esperado','E','#22C29A'],proceso:['En proceso','P','#FFD23F'],apoyo:['Requiere apoyo','A','#F04E7E']};

function hace(ts){if(!ts)return 'nunca';const s=(Date.now()-new Date(ts).getTime())/1000;return s<60?'hace un momento':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:new Date(ts).toLocaleDateString('es-MX',{day:'numeric',month:'short'})}
const its=(a,c,act)=>PD.it.filter(x=>x.alumno_id===a&&(!c||x.clase===c)&&(!act||x.actividad===act)).sort((x,y)=>x.intento-y.intento);
const primero=(a,c,act)=>its(a,c,act)[0],ultimo=(a,c,act)=>{const l=its(a,c,act);return l[l.length-1]};
const esAbierta=(c,act)=>{const e=(EJ[c]||[]).find(x=>x.id===act);return e&&(e.tipo==='abierta'||e.tipo==='mediciones')};
async function traerTodo(tabla,orden){let out=[],i=0;for(;;){const {data,error}=await sb.from(tabla).select('*').order(orden).range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;i+=1000}return out}
async function cargarPanel(){const [a,b,c,d]=await Promise.all([sb.from('perfiles').select('id,usuario,nombre,num').eq('rol','alumno').order('num'),traerTodo('avance','alumno_id'),traerTodo('intentos','id'),traerTodo('practicas','alumno_id')]);
 PD.al=a.data||[];PD.av={};b.forEach(r=>PD.av[r.alumno_id]=r);PD.it=c;PD.pr={};d.forEach(r=>{if(r.revisada)PD.pr[r.alumno_id+'|'+r.clase]=true});
 const [eq,aj]=await Promise.all([sb.from('equipos').select('*').order('id'),sb.from('ajustes').select('datos').eq('id',1).maybeSingle()]);PD.eq=eq.data||[];PD.cfg=aj.data?aj.data.datos:{}}

function suscribir(){if(canal)return;
 canal=sb.channel('panel-3a')
 .on('postgres_changes',{event:'*',schema:'public',table:'avance'},p=>{if(p.new&&p.new.alumno_id)PD.av[p.new.alumno_id]=p.new;redib()})
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'intentos'},p=>{if(!PD.it.some(x=>x.id===p.new.id))PD.it.push(p.new);redib()})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'intentos'},p=>{const i=PD.it.findIndex(x=>x.id===p.new.id);if(i>=0)PD.it[i]=p.new;redib()})
 .on('postgres_changes',{event:'*',schema:'public',table:'practicas'},p=>{const r=p.eventType==='DELETE'?p.old:p.new;if(r&&r.alumno_id){const k=r.alumno_id+'|'+r.clase;if(p.eventType==='DELETE'||!r.revisada)delete PD.pr[k];else PD.pr[k]=true}redib()})
 .subscribe(st=>{rtEstado=st;const s=document.getElementById('rt');if(s)s.innerHTML=rtTxt()});
 setInterval(async()=>{if(document.visibilityState!=='visible'||!YO)return;try{await cargarPanel();redib()}catch(e){}},120000)}
const rtTxt=()=>rtEstado==='SUBSCRIBED'?'<span class="dot on"></span> En vivo':'<span class="dot"></span> Reconectando…';
function redib(){clearTimeout(redT);redT=setTimeout(dib,400)}
function pendientes(){const out=[];PD.al.forEach(a=>CL.forEach(c=>(EJ[c]||[]).forEach(e=>{if(!esAbierta(c,e.id))return;const u=ultimo(a.id,c,e.id);if(u&&!u.nivel)out.push(u)})));return out.sort((x,y)=>new Date(x.creado)-new Date(y.creado))}

 document.getElementById('ptabs').innerHTML=[['grupo','Mi grupo'],['revisar',`Por revisar (${pend.length})`],['practicas','Prácticas'],['calif','Calificación']].map(([k,t])=>`<button data-v="${k}" class="${vista===k&&!selAl?'on':''}">${t}</button>`).join('')+`<button class="prim" id="xls">Descargar Excel</button>`;

 const d=primero(a.id,c,'demuestra');if(l.tipo==='teo'){b.push(d?`<span class="bd ${d.puntaje/d.maximo>=.8?'v':d.puntaje/d.maximo>=.6?'a':'r'}" title="Demuestra, 1.er intento">D ${fmt(d.puntaje)}/${d.maximo}</span>`:'<span class="bd g">D –</span>')}
 else b.push(PD.pr[a.id+'|'+c]?'<span class="bd v" title="Práctica revisada">P ✓</span>':'<span class="bd g" title="Práctica sin marcar">P –</span>');
 (EJ[c]||[]).forEach((e,k)=>{const n='R'+(k+1);if(esAbierta(c,e.id)){const u=ultimo(a.id,c,e.id);b.push(!u?`<span class="bd g">${n} –</span>`:u.nivel?`<span class="bd" style="background:${NIV[u.nivel][2]}" title="${NIV[u.nivel][0]}">${n} ${NIV[u.nivel][1]}</span>`:`<span class="bd rev" title="Por revisar">${n} ✎</span>`)}

 ${CL.map(c=>{const l=L.find(x=>x.id===c),acts=['demuestra',...(EJ[c]||[]).map(e=>e.id)].filter(x=>l.tipo==='teo'||x!=='demuestra');return `<h2>${cN(c)}. ${esc(corto(l))}</h2>${l.tipo==='prac'?`<p>Práctica: ${PD.pr[id+'|'+c]?'<b>revisada ✓</b>':'sin marcar'} <button class="mini-b" data-pr="${c}">${PD.pr[id+'|'+c]?'Quitar':'Marcar como revisada'}</button></p>`:''}
  ${acts.map(act=>{const l2=its(id,c,act);if(!l2.length)return `<p class="nota">${esc(actNombre(c,act))}: sin intentos.</p>`;const ab=esAbierta(c,act);
   return `<div class="tarjeta" style="margin-bottom:12px"><h3>${esc(actNombre(c,act))}</h3>${l2.map((x,k)=>`<details ${ab&&k===l2.length-1?'open':''}><summary>${ab?'Versión':'Intento'} ${x.intento}${x.puntaje!=null?` · <b>${fmt(x.puntaje)}/${x.maximo}</b>`:''}${x.nivel?` · ${NIV[x.nivel][0]}`:ab?' · por revisar':''}${k===0&&!ab?' · <b>cuenta para calificación</b>':''} · ${new Date(x.creado).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${x.duracion_s?` · ${Math.round(x.duracion_s/60)||1} min`:''}</summary>${respHTML(x)}${ab?nivelBtns(x):''}</details>`).join('')}</div>`}).join('')}`}).join('')}`;
 pv.querySelector('#volver').onclick=()=>{selAl=null;dib();scrollTo(0,0)};
 pv.querySelector('#cp').onclick=async()=>{const p=pv.querySelector('#np').value.trim();if(p.length<6){toast('Mínimo 6 caracteres.');return}const {error}=await sb.rpc('cambiar_password',{p_usuario:a.usuario,p_pass:p});toast(error?'No se pudo cambiar la contraseña.':`Listo. Nueva contraseña de ${a.usuario}: ${p}`);if(!error)pv.querySelector('#np').value=''};
 pv.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>marcar([id],b.dataset.pr,!PD.pr[id+'|'+b.dataset.pr]));
 bindNivel(pv)}
function cargarXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportar(){try{await cargarXLSX()}catch(e){toast('No se pudo preparar el Excel.');return}
 const val=(a,c,act)=>{if(esAbierta(c,act)){const u=ultimo(a.id,c,act);return !u?'':u.nivel?NIV[u.nivel][0]:'Sin revisar'}const p=primero(a.id,c,act);return p?+fmt(p.puntaje/p.maximo*10):''};
 const head=['N.º','Nombre','Usuario'];CL.forEach((c,i)=>{const l=L[i];if(l.tipo==='teo')head.push(`C${i+1} Demuestra (/10)`);else head.push(`C${i+1} Práctica`);(EJ[c]||[]).forEach((e,k)=>head.push(`C${i+1} Reto ${k+1}${esAbierta(c,e.id)?'':' (/10)'}`))});head.push('Puntos','Último acceso');
 const res=[head,...PD.al.map(a=>{const r=[a.num,a.nombre,a.usuario];CL.forEach((c,i)=>{if(L[i].tipo==='teo')r.push(val(a,c,'demuestra'));else r.push(PD.pr[a.id+'|'+c]?'Sí':'No');(EJ[c]||[]).forEach(e=>r.push(val(a,c,e.id)))});const av=PD.av[a.id];r.push(av&&av.datos?av.datos.pts||0:0,av?new Date(av.actualizado).toLocaleString('es-MX'):'');return r})];
 const nom=Object.fromEntries(PD.al.map(a=>[a.id,a]));
 const ints=[['N.º','Nombre','Clase','Actividad','Intento','Puntaje','Máximo','Nivel','Duración (min)','Fecha'],...PD.it.filter(x=>nom[x.alumno_id]).sort((x,y)=>nom[x.alumno_id].num-nom[y.alumno_id].num||x.id-y.id).map(x=>[nom[x.alumno_id].num,nom[x.alumno_id].nombre,cN(x.clase),actNombre(x.clase,x.actividad),x.intento,x.puntaje,x.maximo,x.nivel?NIV[x.nivel][0]:'',x.duracion_s?Math.round(x.duracion_s/6)/10:'',new Date(x.creado).toLocaleString('es-MX')])];
 const ab=[['N.º','Nombre','Clase','Actividad','Pregunta','Respuesta','Nivel']];PD.al.forEach(a=>CL.forEach(c=>(EJ[c]||[]).forEach(e=>{if(!esAbierta(c,e.id))return;const u=ultimo(a.id,c,e.id);if(!u)return;const d=u.detalle||{};const lev=u.nivel?NIV[u.nivel][0]:'Sin revisar';
  if(d.respuestas)d.preguntas.forEach((q,i)=>ab.push([a.num,a.nombre,cN(c),e.titulo,q,d.respuestas[i],lev]));
  if(d.mediciones)ab.push([a.num,a.nombre,cN(c),e.titulo,'Mediciones',d.mediciones.map(m=>m.campo+': '+m.valor+' V').join('; ')+' · '+d.observacion,lev])})));
 const cal=[['N.º','Nombre',...CL.map((c,i)=>`C${i+1} ${corto(L[i])}`),'Unidad','Nivel'],...PD.al.map(a=>{const r=califAl(a);return [a.num,a.nombre,...r.clases.map(x=>x==null?'':x),r.final==null?'':r.final,r.nivel?NIV[r.nivel][0]:'']})];
 const wb=XLSX.utils.book_new();[[cal,'Calificación'],[res,'Resumen'],[ints,'Intentos'],[ab,'Respuestas abiertas']].forEach(([d,n])=>{const ws=XLSX.utils.aoa_to_sheet(d);ws['!cols']=d[0].map((h,i)=>({wch:i===1?34:/Respuesta|Pregunta/.test(h)?60:14}));XLSX.utils.book_append_sheet(wb,ws,n)});
 XLSX.writeFile(wb,`Circuitos_3A_${new Date().toISOString().slice(0,10)}.xlsx`)}
/* ---------- Calificación por clase ---------- */
const NUMNIV={esperado:10,proceso:8,apoyo:6};
const RUB=['Diagnóstico','Funcionamiento','Diagrama y Ley de Ohm','Factibilidad','Difusión'];
const cfg=()=>Object.assign({modo:'hoy',pesoRetos:50},PD.cfg||{});
function trabajado(c,act){return PD.al.filter(a=>its(a.id,c,act).length).length>=PD.al.length/2}
function notaAct(a,c,act){if(esAbierta(c,act)){const u=ultimo(a.id,c,act);return u?(u.nivel?NUMNIV[u.nivel]:undefined):null}const p=primero(a.id,c,act);return p?p.puntaje/p.maximo*10:null}
function promedio(xs){const v=xs.filter(x=>x!==undefined);return v.length?v.reduce((s,x)=>s+(x??0),0)/v.length:null}
function nivelDe(f){return f==null?null:f<7?'apoyo':f<9?'proceso':'esperado'}
const r1=x=>Math.round(x*10)/10;
function claseVista(c){const l=L.find(x=>x.id===c);return (l.tipo==='teo'?trabajado(c,'demuestra'):PD.al.some(x=>PD.pr[x.id+'|'+c]))||(EJ[c]||[]).some(e=>trabajado(c,e.id))}
function califClase(a,c){const C=cfg(),fin=C.modo==='final';if(!fin&&!claseVista(c))return null;
 const l=L.find(x=>x.id===c),wr=Math.min(100,Math.max(0,+C.pesoRetos))/100;
 const base=l.tipo==='teo'?(notaAct(a,c,'demuestra')??0):(PD.pr[a.id+'|'+c]?10:0);
 const ret=promedio((EJ[c]||[]).map(e=>notaAct(a,c,e.id)));
 const f=ret==null?base:base*(1-wr)+ret*wr;return Math.max(5,r1(f))}
function califAl(a){const cls=CL.map(c=>califClase(a,c)),v=cls.filter(x=>x!=null);const f=v.length?Math.max(5,r1(v.reduce((s,x)=>s+x,0)/v.length)):null;return {clases:cls,final:f,nivel:nivelDe(f)}}
const chipNiv=(f,n)=>f==null?'<span class="nota">—</span>':`<span class="fin" style="background:${NIV[n][2]}">${fmt(f)}</span>`;
let cfgT=0;function guardarCfg(){clearTimeout(cfgT);cfgT=setTimeout(async()=>{const {error}=await sb.from('ajustes').upsert({id:1,datos:PD.cfg,actualizado:new Date().toISOString()});if(error)toast('No se pudieron guardar los ajustes.')},500)}
function vCalif(pv){const C=cfg(),rows=PD.al.map(a=>[a,califAl(a)]),cnt={esperado:0,proceso:0,apoyo:0};rows.forEach(([,r])=>{if(r.nivel)cnt[r.nivel]++});
 pv.innerHTML=`<div class="tarjeta" style="margin-bottom:18px"><h3>Cómo se calcula cada clase</h3>
 <ul class="lista"><li><b>Clases de teoría (1, 2, 4 y 5):</b> Demuestra (1.er intento) ${100-C.pesoRetos} % + promedio de sus retos ${C.pesoRetos} %.</li><li><b>Prácticas (3, 6 y 7):</b> práctica marcada por ti ${100-C.pesoRetos} % + promedio de sus retos ${C.pesoRetos} %.</li><li><b>Unidad:</b> promedio de las clases. El proyecto lo evalúas tú aparte.</li></ul>
 <label class="sl" style="font-size:16px;max-width:320px;margin-top:8px">Peso de los retos dentro de cada clase (%)<input type="number" min="0" max="100" step="10" id="pr" value="${C.pesoRetos}"></label>
 <p class="nota" style="margin-top:8px">Respuestas abiertas: Nivel esperado = 10, En proceso = 8, Requiere apoyo = 6 (las que no has revisado todavía no cuentan). La calificación mínima es 5.</p>
 <div class="mats" style="margin-top:6px"><button data-modo="hoy" class="${C.modo!=='final'?'on':''}">Hasta hoy</button><button data-modo="final" class="${C.modo==='final'?'on':''}">Cierre de la unidad</button></div>
 <p class="nota" style="margin:8px 0 0">${C.modo==='final'?'<b>Cierre:</b> las 7 clases cuentan y lo que falte vale 0.':'<b>Hasta hoy:</b> solo aparecen las clases que ya trabajó al menos la mitad del grupo; si un alumno no hizo algo de esa clase, cuenta 0.'}</p></div>
 <div class="stats" style="margin-bottom:16px">${Object.entries(cnt).map(([k,v])=>`<span class="stat" style="background:${NIV[k][2]}"><b>${v}</b> ${NIV[k][0]} (unidad)</span>`).join('')}</div>
 <div class="scroll"><table class="pt"><thead><tr><th>N.º</th><th>Alumno</th>${CL.map((c,i)=>`<th title="${esc(L[i].titulo)}">C${i+1}${L[i].tipo==='prac'?' · P':''}</th>`).join('')}<th>Unidad</th></tr></thead><tbody>
 ${rows.map(([a,r])=>`<tr data-a="${a.id}" tabindex="0"><td>${a.num}</td><td class="nm">${esc(a.nombre)}</td>${r.clases.map(x=>`<td>${chipNiv(x,nivelDe(x))}</td>`).join('')}<td>${chipNiv(r.final,r.nivel)}</td></tr>`).join('')}</tbody></table></div>`;
 pv.querySelector('#pr').onchange=e=>{PD.cfg=cfg();PD.cfg.pesoRetos=Math.min(100,Math.max(0,+e.target.value||0));guardarCfg();e.target.blur();dib()};
 pv.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{PD.cfg=cfg();PD.cfg.modo=b.dataset.modo;guardarCfg();dib()});
 pv.querySelectorAll('tr[data-a]').forEach(r=>r.onclick=()=>{selAl=r.dataset.a;dib();scrollTo(0,0)})}
/* ---------- Proyecto por equipo ---------- */
let pickEq=null,borrar=null;
const corto2=n=>{const p=n.split(' ');return p.length>2?p.slice(2).join(' ')+' '+p[0]:n};
async function guardarEq(e){e.actualizado=new Date().toISOString();const lleno=RUB.every(k=>e.rubrica[k]);e.calificacion=lleno?Math.round(RUB.reduce((s,k)=>s+NUMNIV[e.rubrica[k]],0)/RUB.length*10)/10:null;
 const {error}=await sb.from('equipos').update({nombre:e.nombre,miembros:e.miembros,rubrica:e.rubrica,calificacion:e.calificacion,actualizado:e.actualizado}).eq('id',e.id);if(error)toast('No se pudo guardar el equipo.')}
function vProyecto(pv){const asig=new Set(PD.eq.flatMap(e=>e.miembros||[])),libres=PD.al.filter(a=>!asig.has(a.id));
 pv.innerHTML=`<div class="aviso" style="margin-top:0;background:#D9F4FF">${chispa('feliz')}<div>Forma los equipos una vez. El día de la entrega calificas cada equipo con la rúbrica y la calificación se pasa sola a todos sus integrantes .</div></div>
 <p><button class="prim cta" id="neq">+ Nuevo equipo</button> <span class="nota">${libres.length?`${libres.length} alumnos sin equipo`:'Todos los alumnos tienen equipo ✓'}</span></p>
 ${PD.eq.map(e=>`<div class="tarjeta eq" style="margin-bottom:18px"><div class="eqh"><input class="eqn" data-e="${e.id}" value="${esc(e.nombre)}" aria-label="Nombre del equipo"><span class="big">${e.calificacion!=null?chipNiv(+e.calificacion,nivelDe(+e.calificacion)):'<span class="nota">Sin calificar</span>'}</span></div>
  <div class="miem">${(e.miembros||[]).map(id=>{const a=PD.al.find(x=>x.id===id);return a?`<button class="ficha" data-quita="${e.id}|${id}" title="Quitar del equipo">${a.num}. ${esc(corto2(a.nombre))} ✕</button>`:''}).join('')}<button class="mini-b" data-pick="${e.id}">${pickEq==e.id?'Listo':'+ Agregar integrantes'}</button></div>
  ${pickEq==e.id?`<div class="bandeja">${libres.length?libres.map(a=>`<button class="ficha" data-mete="${e.id}|${a.id}">${a.num}. ${esc(corto2(a.nombre))}</button>`).join(''):'<span class="nota">No quedan alumnos sin equipo.</span>'}</div>`:''}
  <table class="pt rub"><tbody>${RUB.map(k=>`<tr><td class="nm">${k}</td><td><div class="mats niv">${Object.entries(NIV).map(([n,v])=>`<button data-rub="${e.id}|${k}|${n}" class="${e.rubrica[k]===n?'on':''}" style="${e.rubrica[k]===n?`background:${v[2]}`:''}">${v[0]}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table>
  <p style="margin:10px 0 0">${borrar==e.id?`<button class="mini-b" data-del="${e.id}" style="background:#FFE0EA">Sí, eliminar equipo</button> <button class="mini-b" data-nodel="1">Cancelar</button>`:`<button class="mini-b" data-del0="${e.id}">Eliminar equipo</button>`}</p></div>`).join('')}`;
 const E=id=>PD.eq.find(x=>x.id==id);
 pv.querySelector('#neq').onclick=async()=>{const {data,error}=await sb.from('equipos').insert({nombre:'Equipo '+(PD.eq.length+1)}).select().single();if(error){toast('No se pudo crear el equipo.');return}PD.eq.push(data);pickEq=data.id;dib()};
 pv.querySelectorAll('.eqn').forEach(i=>i.onchange=()=>{const e=E(i.dataset.e);e.nombre=i.value.trim()||e.nombre;guardarEq(e);i.blur()});
 pv.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{pick=pickEq==b.dataset.pick?null:+b.dataset.pick;dib()});
 pv.querySelectorAll('[data-mete]').forEach(b=>b.onclick=()=>{const [ei,a]=b.dataset.mete.split('|');const e=E(ei);e.miembros=[...(e.miembros||[]),a];guardarEq(e);dib()});
 pv.querySelectorAll('[data-quita]').forEach(b=>b.onclick=()=>{const [ei,a]=b.dataset.quita.split('|');const e=E(ei);e.miembros=e.miembros.filter(x=>x!==a);guardarEq(e);dib()});
 pv.querySelectorAll('[data-rub]').forEach(b=>b.onclick=()=>{const [ei,k,n]=b.dataset.rub.split('|');const e=E(ei);e.rubrica=Object.assign({},e.rubrica,{[k]:n});guardarEq(e).then(dib);dib()});
 pv.querySelectorAll('[data-del0]').forEach(b=>b.onclick=()=>{borrar=+b.dataset.del0;dib()});
 pv.querySelectorAll('[data-nodel]').forEach(b=>b.onclick=()=>{borrar=null;dib()});
 pv.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('equipos').delete().eq('id',+b.dataset.del);if(error){toast('No se pudo eliminar.');return}PD.eq=PD.eq.filter(x=>x.id!=b.dataset.del);borrar=null;dib()})}

/* ---------- Revisar por pregunta ---------- */
let revSel=null,revTodas=false,revFoco=null;
function abiertasLista(){const out=[];CL.forEach(c=>(EJ[c]||[]).forEach(e=>{if(!esAbierta(c,e.id))return;const us=PD.al.map(a=>ultimo(a.id,c,e.id)).filter(Boolean);if(us.length)out.push({c,act:e.id,t:e.titulo,total:us.length,pend:us.filter(u=>!u.nivel).length})}));return out}
async function setNivel(id,n){const {error}=await sb.from('intentos').update({nivel:n}).eq('id',id);if(error){toast('No se pudo guardar.');return false}const x=PD.it.find(y=>y.id===id);if(x)x.nivel=n;return true}
function vRevisar(pv){const lista=abiertasLista();
 if(!lista.length){pv.innerHTML=`<div class="aviso" style="background:#D9F7EE">${chispa('wow')}<div>Todavía no hay respuestas abiertas.</div></div>`;return}
 if(!revSel||!lista.some(x=>x.c+'|'+x.act===revSel)){const p=lista.find(x=>x.pend)||lista[0];revSel=p.c+'|'+p.act}
 const [c,act]=revSel.split('|');
 const items=PD.al.map(a=>({a,u:ultimo(a.id,c,act)})).filter(x=>x.u&&(revTodas||!x.u.nivel));
 pv.innerHTML=`<p class="nota">Elige una pregunta y califica todas las respuestas seguidas. Atajo: toca una tarjeta y usa las teclas <b>1</b> = Nivel esperado, <b>2</b> = En proceso, <b>3</b> = Requiere apoyo; pasa sola a la siguiente.</p>
 <div class="mats" style="margin-bottom:12px">${lista.map(x=>`<button data-sel="${x.c}|${x.act}" class="${revSel===x.c+'|'+x.act?'on':''}">${cN(x.c)} · ${esc(x.t)} <b>(${x.pend})</b></button>`).join('')}</div>
 <p><label style="font-weight:700"><input type="checkbox" id="rtodas" ${revTodas?'checked':''} style="width:20px;height:20px;vertical-align:middle"> Mostrar también las ya calificadas</label></p>
 ${items.length?items.map(({a,u})=>`<div class="tarjeta rc" tabindex="0" data-id="${u.id}" style="margin-bottom:12px"><h3>${a.num}. ${esc(a.nombre)} <span class="nota" style="font-weight:600">· versión ${u.intento} · ${hace(u.creado)}</span></h3>${respHTML(u)}${nivelBtns(u)}</div>`).join(''):`<div class="aviso" style="background:#D9F7EE">${chispa('wow')}<div>¡Listo! Ya calificaste todas las respuestas de esta pregunta.</div></div>`}`;
 pv.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{revSel=b.dataset.sel;revFoco=null;dib()});
 pv.querySelector('#rtodas').onchange=e=>{revTodas=e.target.checked;e.target.blur();dib()};
 const cards=[...pv.querySelectorAll('.rc')];
 const calificar=async(card,n)=>{const i=cards.indexOf(card),sig=cards[i+1]||cards[i-1];if(await setNivel(+card.dataset.id,n)){revFoco=sig&&sig!==card?sig.dataset.id:null;dib()}};
 cards.forEach(card=>{card.onkeydown=ev=>{const n={'1':'esperado','2':'proceso','3':'apoyo'}[ev.key];if(n){ev.preventDefault();calificar(card,n)}};
  card.querySelectorAll('[data-nivel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();calificar(card,b.dataset.nivel)})});
 if(revFoco){const f=pv.querySelector(`.rc[data-id="${revFoco}"]`);if(f){f.focus({preventScroll:true});f.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})}}}

if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&YO){YO=null;login()}});
arrancar();

}
